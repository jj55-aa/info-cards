<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/info-cards/manifest.json">
<title>工作信息卡</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0f0f0f; color:#e0e0e0; min-height:100vh; padding:16px; }
h1 { font-size:18px; font-weight:600; margin-bottom:4px; color:#fff; }
.subtitle { font-size:12px; color:#888; margin-bottom:20px; }
.card { background:#1a1a1a; border-radius:12px; padding:14px 16px; margin-bottom:12px; border-left:3px solid #444; }
.card.priority-high { border-left-color:#ff4d4d; }
.card.priority-mid { border-left-color:#f0a500; }
.card.priority-low { border-left-color:#4d94ff; }
.card-source { font-size:11px; color:#888; margin-bottom:6px; display:flex; justify-content:space-between; }
.card-summary { font-size:15px; line-height:1.5; color:#ddd; }
.empty { text-align:center; color:#555; padding:60px 20px; font-size:15px; }
.refresh { position:fixed; bottom:20px; right:20px; width:44px; height:44px; border-radius:50%; background:#333; border:none; color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.timestamp { text-align:right; font-size:10px; color:#555; margin-top:20px; }
</style>
</head>
<body>
<h1>📋 工作信息卡</h1>
<p class="subtitle">微信重要消息自动汇总</p>
<div id="cards"></div>
<p class="timestamp" id="ts"></p>
<button class="refresh" onclick="load()" title="刷新">↻</button>
<script>
const API = 'info-cards.json';
function timeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  return Math.floor(diff/86400) + '天前';
}
async function load() {
  try {
    const r = await fetch(API + '?v=' + Date.now());
    const d = await r.json();
    const el = document.getElementById('cards');
    if (!d.cards || d.cards.length === 0) {
      el.innerHTML = '<div class="empty">暂无工作信息<br>在微信里转发消息给 Hermes 并说「提取」</div>';
    } else {
      el.innerHTML = d.cards.slice().reverse().map(c => `
        <div class="card priority-${c.priority||'mid'}">
          <div class="card-source"><span>${c.source||'微信群'}</span><span>${c.time||''}</span></div>
          <div class="card-summary">${c.summary}</div>
        </div>
      `).join('');
    }
    document.getElementById('ts').textContent = d.updated ? '更新于 ' + timeAgo(d.updated) : '';
  } catch(e) {
    document.getElementById('cards').innerHTML = '<div class="empty">加载失败，下拉刷新</div>';
  }
}
load();
</script>
</body>
</html>
